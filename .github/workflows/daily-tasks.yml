# 每日自动执行领克App签到 + 分享，并通过 Bark 推送结果。
# 敏感字段（账号 token/deviceId、应用签名密钥、Bark key）均通过仓库 Secrets
# 提供，代码中不含任何默认值，未配置会直接报错退出，获取方式见 readme.md。
# 说明：
#   - 登录环节存在滑块验证码，无法在 CI 中完全自动化，本工作流依赖
#     refreshToken 自动续期获取 token。
#   - LYNKCO_APP_SECRETS 是领克官方 App 的应用级共用签名密钥集合
#     （非个人账号凭证），一个 JSON 字符串 Secret 整合以下 4 个独立字段，
#     必须配置，否则脚本无法计算请求签名。
#   - refreshToken 为轮换制（每次续期发新值，旧值短时作废），Secrets 静态
#     存不了轮换链：最新值用 nativeAppSecret 派生密钥 AES-GCM 加密后存为
#     仓库内密文文件 LynkCoHelper/.rt-state.enc（公开可见但无害），每次
#     运行结束时由 GITHUB_TOKEN 自动 commit 更新。Secrets 里的
#     LYNKCO_REFRESH_TOKEN 仅作密文文件缺失/损坏时的兜底种子。

name: LynkCoHelperRunner

on:
  # 仅手动/API 触发（workflow_dispatch）。GitHub 免费版的 cron 调度实测
  # 延迟 2 小时以上且高峰时段静默丢弃，不可依赖，改由 iOS 快捷指令自动化
  # 在每天固定时间调用 GitHub API 触发（token 仅授权本仓库 Actions 权限）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-tasks:

    runs-on: ubuntu-latest

    steps:
    - name: CheckOut
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ./LynkCoHelper/requirements.txt ]; then pip install -r ./LynkCoHelper/requirements.txt; fi

    - name: 恢复上次轮换后的 refreshToken（仓库密文链）
      env:
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
      run: |
        set -e
        if [ -f LynkCoHelper/.rt-state.enc ]; then
          python LynkCoHelper/tools/refresh_state.py restore LynkCoHelper/.rt-state.enc > .rt_restored \
            && echo "[restore] 已从仓库密文恢复轮换后的 refreshToken" \
            || { echo "[restore] 密文解密失败（密钥变更?），回退 Secrets 种子"; rm -f .rt_restored; }
        else
          echo "[restore] 仓库无密文文件（首次运行），将使用 Secrets 种子"
        fi

    - name: 组装 env.json（多账号凭据 + 轮换链回填）
      env:
        LYNKCO_USERS_JSON: ${{ secrets.LYNKCO_USERS_JSON }}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
        LYNKCO_BARK_KEY: ${{ secrets.LYNKCO_BARK_KEY }}
      run: |
        set -e
        # LYNKCO_USERS_JSON 为各账号冷启动凭据（[{name, refreshToken, deviceId}, ...]）；
        # 未配置时回退单账号 Secrets（LYNKCO_REFRESH_TOKEN/DISABLED 见下步）。
        # .rt_restored 存在则把轮换后的最新 refreshToken 按账号名回填。
        python LynkCoHelper/tools/bootstrap_env.py LynkCoHelper/env.json .rt_restored

    - name: Run sign-in and notify
      env:
        # env.json 已由上一步组装（多账号），以下单账号 Secrets 仅作
        # LYNKCO_USERS_JSON 未配置时的兜底种子，双账号场景不参与取值。
        LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
        LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
        # Bark 推送 key，详见 lynkco_notify.py
        LYNKCO_BARK_KEY: ${{ secrets.LYNKCO_BARK_KEY }}
        # App 共用签名密钥集合（JSON 字符串，详见 lynkco_common.py），必须配置，
        # 否则脚本会在计算签名时报错退出。字段名与 env.json 的 secrets 段一致：
        # {"nativeAppKey":"","nativeAppSecret":"","nativeAppCode":"",
        #  "loginAppCode":""}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
        # Bark 推送图标 URL（可选项，不配则 Bark 使用默认图标）
        LYNKCO_BARK_ICON: ${{ secrets.LYNKCO_BARK_ICON }}
        LYNKCO_TIMEOUT: ${{ vars.LYNKCO_TIMEOUT || '30' }}
        LYNKCO_RETRIES: ${{ vars.LYNKCO_RETRIES || '2' }}
      run: |
        # env.json 已由 bootstrap_env.py 组装完成（含轮换链回填），直接运行
        python ./LynkCoHelper/lynkco_daily_tasks.py

    - name: 持久化轮换后的 refreshToken 到仓库密文
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ github.token }}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
      run: |
        # 任务即使失败，只要续期成功过 env.json 就有新值；持久化失败不阻断
        if ! python LynkCoHelper/tools/refresh_state.py persist LynkCoHelper/env.json new-rt.enc; then
          echo "[persist] 本次未产生新 refreshToken，跳过"
          exit 0
        fi
        if cmp -s new-rt.enc LynkCoHelper/.rt-state.enc; then
          echo "[persist] 轮换值未变化，跳过提交"
          exit 0
        fi
        SHA=$(gh api "repos/${{ github.repository }}/contents/LynkCoHelper/.rt-state.enc" --jq '.sha' || true)
        ARGS=(--method PUT "repos/${{ github.repository }}/contents/LynkCoHelper/.rt-state.enc"
              -f message="chore: rotate refresh token state [skip ci]"
              -f branch="${{ github.ref_name }}"
              -f content="$(base64 -w0 new-rt.enc)")
        if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
        gh api "${ARGS[@]}" > /dev/null && echo "[persist] 仓库密文已更新"
